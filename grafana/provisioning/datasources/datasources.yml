# ==============================================================================
# GRAFANA DATASOURCE PROVISIONING
# Tự động kết nối Prometheus và Loki khi Grafana khởi động
# ==============================================================================

apiVersion: 1

datasources:
  # 1. Prometheus Datasource (Metrics)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
      httpMethod: POST

  # 2. Loki Datasource (Centralized Logs)
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
