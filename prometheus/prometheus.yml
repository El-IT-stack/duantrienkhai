# ==============================================================================
# HỆ THỐNG QUẢN LÝ DỰ ÁN (PROJECT MANAGEMENT) - PROMETHEUS CONFIGURATION
# Mục đích: Định kỳ scrape các metrics thời gian thực từ Backend & Exporters
# ==============================================================================

global:
  scrape_interval: 10s       # Chu kỳ thu thập metrics mặc định (10 giây)
  evaluation_interval: 10s   # Chu kỳ đánh giá alerting rules
  scrape_timeout: 5s

scrape_configs:
  # 1. Thu thập metrics từ NestJS Backend API (Prom-client)
  - job_name: 'backend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['backend:3000']
        labels:
          service: 'backend'
          environment: 'production'
          app: 'project-management'

  # 2. Thu thập metrics từ cAdvisor (CPU, RAM, Network, I/O của container)
  - job_name: 'cadvisor'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          environment: 'production'
          app: 'project-management'

  # 3. Thu thập metrics từ Nginx Prometheus Exporter (Kết nối, Requests)
  - job_name: 'nginx-exporter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx-exporter'
          environment: 'production'
          app: 'project-management'

  # 4. Thu thập metrics từ PostgreSQL Exporter (Active connections, Trans, Locks)
  - job_name: 'postgres-exporter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres-exporter'
          environment: 'production'
          app: 'project-management'

  # 5. Thu thập metrics nội tại của chính Prometheus
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          environment: 'production'
