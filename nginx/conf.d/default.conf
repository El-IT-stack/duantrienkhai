# ==============================================================================
# HỆ THỐNG QUẢN LÝ DỰ ÁN (PROJECT MANAGEMENT) - NGINX REVERSE PROXY
# Cấu hình định tuyến:
#   - /            -> Frontend React SPA (Single Page Application)
#   - /api/        -> Backend NestJS REST API
#   - /stub_status -> Nginx Prometheus Exporter metrics
# ==============================================================================

# Định dạng JSON Access Log tối ưu cho Promtail và Loki (LogQL parsing)
log_format json_analytics escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent"'
'}';

# Upstream definitions
upstream frontend_service {
    server frontend:80 max_fails=3 fail_timeout=10s;
}

upstream backend_service {
    server backend:3000 max_fails=3 fail_timeout=10s;
}

# ------------------------------------------------------------------------------
# 1. CẤU HÌNH HTTP (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name localhost;

    # Log files format để Promtail thu thập và phân tích
    access_log /var/log/nginx/pm_access.log json_analytics;
    error_log /var/log/nginx/pm_error.log warn;

    # Kích thước tối đa cho body request
    client_max_body_size 25M;

    # Gzip Compression tối ưu tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers (Hardening)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' ws: wss:;" always;

    # Nginx Health Check Endpoint
    location /nginx-health {
        access_log off;
        return 200 "Nginx reverse proxy is healthy\n";
    }

    # Nginx Prometheus Exporter Stub Status Endpoint
    location /stub_status {
        stub_status on;
        access_log off;
        allow all;
    }

    # 1.1. Chuyển tiếp toàn bộ API request (/api/) sang Backend NestJS
    location /api/ {
        proxy_pass http://backend_service;

        # Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 1.2. Chuyển tiếp toàn bộ giao diện Web (/) sang Frontend React
    location / {
        proxy_pass http://frontend_service;

        # Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }
}

# ------------------------------------------------------------------------------
# 2. CẤU HÌNH HTTPS (Port 443) - Dành cho môi trường bật SSL
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # SSL Hardening protocols & ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Log files
    access_log /var/log/nginx/pm_access.log json_analytics;
    error_log /var/log/nginx/pm_error.log warn;

    client_max_body_size 25M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' ws: wss:;" always;

    location /nginx-health {
        access_log off;
        return 200 "Nginx HTTPS is healthy\n";
    }

    location /stub_status {
        stub_status on;
        access_log off;
        allow all;
    }

    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }
}
