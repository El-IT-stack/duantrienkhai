# ==============================================================================
# HỆ THỐNG QUẢN LÝ DỰ ÁN (PROJECT MANAGEMENT) - DOCKER COMPOSE ORCHESTRATION
# Đề tài 14 - Môn Triển khai & Quản trị Hệ thống Phần mềm
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE POSTGRESQL (Lưu trữ quan hệ chính)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pm_postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_management_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongP@ssw0rd_2026_Secure!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - pm_internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. PGADMIN 4 (Web Database GUI Client)
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pm_pgadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@pm.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-PgAdmin@2026_Secure!}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGPASS_FILE: /tmp/pgpass
    volumes:
      - ./database/servers.json:/pgadmin4/servers.json:ro
      - ./database/pgpass:/tmp/pgpass:ro
    networks:
      - pm_internal_network
      - pm_public_network
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. BACKEND API (NestJS REST API, Swagger, Prom-client)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pm_backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 3000
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-project_management_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongP@ssw0rd_2026_Secure!}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_project_management_2026_xyz987}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      CORS_ORIGIN: "*"
    volumes:
      - backend_logs:/var/log/backend
    networks:
      - pm_internal_network
      - pm_monitoring_network
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 4. FRONTEND APP (React + Vite + Tailwind CSS SPA)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pm_frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - pm_public_network
    depends_on:
      - backend

  # ----------------------------------------------------------------------------
  # 5. NGINX REVERSE PROXY (Cổng giao tiếp duy nhất ra ngoài cho Web & API)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: pm_nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - pm_public_network
      - pm_internal_network
      - pm_monitoring_network
    depends_on:
      - frontend
      - backend

  # ----------------------------------------------------------------------------
  # 6. PROMETHEUS (Thu thập & Lưu trữ Metrics hệ thống)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: pm_prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - pm_monitoring_network
      - pm_public_network

  # ----------------------------------------------------------------------------
  # 7. GRAFANA (Dashboard trực quan hóa Metrics & Logs)
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: pm_grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-Grafana@2026_Secure!}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - pm_monitoring_network
      - pm_public_network
    depends_on:
      - prometheus
      - loki

  # ----------------------------------------------------------------------------
  # 8. LOKI (Log Aggregation Engine)
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.5
    container_name: pm_loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - pm_monitoring_network

  # ----------------------------------------------------------------------------
  # 9. PROMTAIL (Log Shipper - Nginx & Backend Logs -> Loki)
  # ----------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.5
    container_name: pm_promtail
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - backend_logs:/var/log/backend:ro
    networks:
      - pm_monitoring_network
    depends_on:
      - loki

  # ----------------------------------------------------------------------------
  # 10. CADVISOR (Container Resource & Performance Metrics)
  # ----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: pm_cadvisor
    restart: unless-stopped
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - pm_monitoring_network

  # ----------------------------------------------------------------------------
  # 11. NGINX PROMETHEUS EXPORTER (Nginx Metrics Scraper)
  # ----------------------------------------------------------------------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: pm_nginx_exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    networks:
      - pm_monitoring_network
    depends_on:
      - nginx

  # ----------------------------------------------------------------------------
  # 12. POSTGRESQL EXPORTER (PostgreSQL Metrics Scraper)
  # ----------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pm_postgres_exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres_admin}:${POSTGRES_PASSWORD:-StrongP@ssw0rd_2026_Secure!}@postgres:5432/${POSTGRES_DB:-project_management_db}?sslmode=disable"
    networks:
      - pm_internal_network
      - pm_monitoring_network
    depends_on:
      postgres:
        condition: service_healthy

# ==============================================================================
# VOLUMES VÀ NETWORKS CÔ LẬP
# ==============================================================================
volumes:
  postgres_data:
    name: pm_postgres_data
  nginx_logs:
    name: pm_nginx_logs
  backend_logs:
    name: pm_backend_logs
  prometheus_data:
    name: pm_prometheus_data
  grafana_data:
    name: pm_grafana_data
  loki_data:
    name: pm_loki_data

networks:
  pm_public_network:
    name: pm_public_network
    driver: bridge
  pm_internal_network:
    name: pm_internal_network
    driver: bridge
  pm_monitoring_network:
    name: pm_monitoring_network
    driver: bridge
